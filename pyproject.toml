[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

# Metadata only — install runtime deps with: pip install -r requirements.txt
[project]
name = "project-starter"
version = "0.0.1"
description = "COMP 3613 FastStarter assignment starter (FastAPI + SQLModel)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kwasi Edwards", email = "kwasiedwards@gmail.com" }
]
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "unit: tests that check one module in isolation (tests/unit)",
    "integration: tests that run requests through the full app (tests/integration)",
]

[tool.setuptools]
packages = ["app"]
